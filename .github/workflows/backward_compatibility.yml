name: Backward compatibility
on:
  push:
    branches:
      - master
  pull_request:
    branches-ignore:
      - release/beta
      - release/master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        package:
          - core
          - enhanced
          - fwfh_cached_network_image
          - fwfh_chewie
          - fwfh_just_audio
          - fwfh_svg
          - fwfh_url_launcher
          - fwfh_webview

    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    env:
      GOLDEN_SKIP: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Update pubspec.yaml
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -e

          sudo snap install yq

          # delete all overrides and use pub.dev versions
          yq e 'del(.dependency_overrides)' -i pubspec.yaml

          # These packages consume core APIs introduced in this branch. When
          # they change alongside core, test every other dependency at its
          # declared minimum while resolving the unreleased core locally.
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed-files"
          case "${{ matrix.package }}" in
            enhanced|fwfh_just_audio|fwfh_webview) _requiresWorkspaceCore=yes ;;
            *) _requiresWorkspaceCore=no ;;
          esac
          if [ "$_requiresWorkspaceCore" = yes ] &&
            grep -q '^packages/core/' "$RUNNER_TEMP/changed-files" &&
            grep -q '^packages/${{ matrix.package }}/' "$RUNNER_TEMP/changed-files"; then
            yq e '.dependency_overrides.flutter_widget_from_html_core.path = "../core"' \
              -i pubspec.yaml
          fi

          # back up SDK constraint
          _sdkVersion=$( yq e .environment.sdk pubspec.yaml )

          # replace:
          #   foo: ^1.0.0
          #   bar: ^2.0.0-0
          # into:
          #   foo: 1.0.0
          #   bar: ^2.0.0-0 (unchanged)
          sed -i'' -e 's#^\(  [^:]*\): ^\([0-9.]*\)$#\1: \2#' pubspec.yaml

          # replace:
          #   foo: ">=1.0.0" 
          #   bar: ">=2.0.0 <4.0.0"
          #   yolo: ">=3.0.0-0"
          # into:
          #   foo: 1.0.0
          #   bar: 2.0.0
          #   yolo: ">=3.0.0-0" (unchanged)
          sed -i'' -e 's#^\(  [^:]*\): ">=\([0-9.]*\)\( <.*\)\{0,1\}"$#\1: \2#' pubspec.yaml

          # restore SDK constraint
          yq e ".environment.sdk = \"${_sdkVersion}\"" -i pubspec.yaml

          # output for debugging
          cat pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: packages/${{ matrix.package }}/pubspec.yaml
      - run: flutter test

  core:
    strategy:
      matrix:
        channel:
          - beta
          - master
          - stable

    # In case one of these fails, create a new PR against the `release/*` branch
    name: core@${{ matrix.channel }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/core
    env:
      GOLDEN_SKIP: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update pubspec.yaml
        run: |
          set -e

          sudo snap install yq

          # delete all overrides and use pub.dev versions
          yq e 'del(.dependency_overrides)' -i pubspec.yaml

          # output for debugging
          cat pubspec.yaml
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ matrix.channel }}
      - run: flutter test

  html_flex:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify hashes
        run: |
          set -e

          _scripts=$( cat packages/core/lib/src/widgets/html_flex.dart | head -n 22 | tail -n 21 )
          bash -c "$_scripts"
