name: fintel_fwfh_url_launcher
version: 0.16.2-beta.1
description: WidgetFactory extension to launch A tag via url_launcher plugin.
homepage: https://github.com/daohoangson/flutter_widget_from_html

environment:
  flutter: ">=3.10.0"
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fintel_widget_from_html_core: ">=0.18.0-beta.1 <0.19.0"
  url_launcher: ^6.3.3

dependency_overrides:
  fintel_widget_from_html_core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: any
  url_launcher_platform_interface: any

funding:
  - https://www.patreon.com/daohoangson
  - https://buymeacoffee.com/daohoangson

topics:
  - fwfh
