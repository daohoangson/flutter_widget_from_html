name: fintel_fwfh_cached_network_image
version: 0.16.4-beta.1
description: WidgetFactory extension to render IMG with cached_network_image plugin.
homepage: https://github.com/gadgetsteach/flutter_widget_from_html

environment:
  flutter: ">=3.10.0"
  sdk: ">=3.0.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  cached_network_image: ^4.0.5
  fintel_widget_from_html_core: ">=0.18.0-beta.1 <0.19.0"
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5

dependency_overrides:
  fintel_widget_from_html_core:
    path: ../core

dev_dependencies:
  file: any
  flutter_test:
    sdk: flutter
  lint: 2.14.0
  mocktail: ^1.0.5

funding:
  - https://www.patreon.com/daohoangson
  - https://buymeacoffee.com/daohoangson

topics:
  - img
  - fwfh
