    - test/images/
funding:
  - https://www.patreon.com/daohoangson
  - https://buymeacoffee.com/daohoangson
screenshots:
  - description: Demo rendering of HTML tags
    path: example/HelloWorldCoreScreen1.gif
  - description: Demo rendering of HTML tags
    path: example/HelloWorldCoreScreen2.jpg
topics:
  - widget
