name: fintel_widget_from_html_core
version: 0.18.0-beta.1
description: Flutter package to render html as widgets that focuses on correctness and extensibility.
homepage: https://github.com/gadgetsteach/flutter_widget_from_html/tree/master/packages/core
environment:
  flutter: ">=3.44.0"
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  csslib: ^1.0.2
  cupertino_ui: ^1.1.4
  flutter:
    sdk: flutter
  html: ^0.15.7
  logging: ^1.3.0
  material_ui: ^1.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  leak_tracker_flutter_testing: any
