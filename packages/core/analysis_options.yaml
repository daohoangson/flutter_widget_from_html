include: package:lint/analysis_options_package.yaml

analyzer:
  errors:
    # TODO: Remove when the Flutter floor can move to >=3.50.
    # package:flutter/material.dart and package:flutter/cupertino.dart are
    # deprecated after v3.47.0-0.0.pre. Keep importing them: MaterialThemeMode
    # still reads the in-framework Theme, and material_ui requires Flutter
    # >=3.44 while fwfh_cached_network_image and fwfh_url_launcher still
    # support 3.10. Migrating the imports would fail that floor.
    deprecated_member_use: ignore
    todo: info
  exclude:
    # TODO: investigate `include_file_not_found` warning
    - example
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    always_put_control_body_on_new_line: true
    missing_whitespace_between_adjacent_strings: false
    # Initializing private fields via named formals makes their names private.
    prefer_initializing_formals: false

    # relative vs. package imports
    always_use_package_imports: false
    avoid_relative_lib_imports: true
    prefer_relative_imports: true
